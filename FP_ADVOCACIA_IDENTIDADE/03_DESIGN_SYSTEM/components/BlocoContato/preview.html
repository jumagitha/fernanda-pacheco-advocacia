<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Bloco de contato</title><style>body{margin:0}</style></head>
<body>
<div class="fp" data-theme="escuro">
  <section class="fp-contato">
    <img class="fp-contato__logo" src="/_blob/e084db14ff2a4ec15b0630cfb360fabd" alt="Fernanda Pacheco Advocacia">
    <ul class="fp-contato__dados">
      <li><span>Advogada</span> OAB/<em class="fp-pendente">[UF e número a confirmar]</em></li>
      <li><span>Telefone</span> <em class="fp-pendente">[telefone a confirmar]</em></li>
      <li><span>E-mail</span> <em class="fp-pendente">[e-mail a confirmar]</em></li>
      <li><span>Endereço</span> <em class="fp-pendente">[endereço a confirmar]</em></li>
      <li><span>Atendimento</span> Remoto e presencial mediante agendamento</li>
    </ul>
  </section>
</div>
