<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envelope com aba grafite</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 880px; height: 440px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F4EF; font-family: Inter, Arial, sans-serif; color: #2D2D2D">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 880px; height: 200px; background: #2D2D2D; clip-path: polygon(0 0, 100% 0, 50% 100%)"></div>
<span aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 880px; height: 200px; clip-path: polygon(0 0, 100% 0, 50% 100%); box-shadow: inset 0 -1px 0 #C4A484"></span>
<img src="../logos/fp-monograma-principal-fundo-escuro.svg" alt="Monograma FP" style="position: absolute; left: 50%; top: 62px; height: 92px; width: auto; transform: translateX(-50%)">
<div style="position: absolute; left: 48px; bottom: 40px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #5E5953">
<img src="../logos/fp-horizontal-principal-fundo-claro.svg" alt="Fernanda Pacheco Advocacia" style="height: 34px; width: auto; margin-bottom: 6px">
<span>[endereço para correspondência a confirmar]</span>
</div>
<div style="position: absolute; right: 64px; bottom: 64px; width: 320px; display: flex; flex-direction: column; gap: 10px; font-size: 14px">
<span style="font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #7D5E3F">Destinatário</span>
<span style="display: block; border-bottom: 1px solid #D9D4CC; height: 22px"></span>
<span style="display: block; border-bottom: 1px solid #D9D4CC; height: 22px"></span>
<span style="display: block; border-bottom: 1px solid #D9D4CC; height: 22px"></span>
</div>
</div>
</body>
</html>
